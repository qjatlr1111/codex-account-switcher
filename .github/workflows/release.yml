name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: .NET 8 준비
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Inno Setup 준비
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: 버전 계산
        id: version
        shell: powershell
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.1.4' }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: 단일 EXE와 설치 파일 생성
        shell: powershell
        run: ./scripts/Build-Installer.ps1 -ApplicationVersion '${{ steps.version.outputs.value }}'

      - name: 빌드 산출물 보관
        uses: actions/upload-artifact@v4
        with:
          name: CodexAccountSwitcher-Windows-x64
          path: |
            dist/CodexAccountSwitcher.exe
            dist/CodexAccountSwitcher-Setup.exe
            dist/SHA256SUMS.txt

      - name: GitHub Release 게시
        if: github.ref_type == 'tag'
        # Windows PowerShell 5.1은 워크플로의 한글 문자열을 시스템 코드 페이지로
        # 처리할 수 있으므로 UTF-8이 기본인 PowerShell 7을 사용합니다.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseNotes = @'
          ## 주요 변경

          - `config.toml`의 custom model provider를 계정 목록 위에서 자동 탐지
          - 회사 게이트웨이 provider를 선택하면 `model_provider`를 적용하고 Codex 재시작
          - ChatGPT 계정을 선택하면 provider 선택 줄만 주석 처리하고 provider 정의는 보존
          - provider 카드를 계정 카드와 같은 좌측 정렬·hover·활성 표시 스타일로 제공
          - provider 전환 전에 대상 이름과 ID를 보여주는 확인창 추가
          - provider 사용 중에는 작업 표시줄 위젯에도 현재 게이트웨이 상태 표시

          ## 보안 및 호환성 안내

          이 프로그램은 OpenAI의 공식 제품이 아닌 비공식 커뮤니티 도구입니다. Codex 호환성을 위해 계정별 `auth.json`이 로컬 디스크에 평문으로 저장되므로 공유 PC나 공용 Windows 계정에서는 사용하지 마세요. 배포 파일은 코드 서명되지 않았으며 Windows SmartScreen 경고가 표시될 수 있습니다. 내려받은 파일은 함께 제공되는 `SHA256SUMS.txt`로 확인할 수 있습니다.
          '@
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'dist/RELEASE_NOTES.md'),
            $releaseNotes,
            [System.Text.UTF8Encoding]::new($false)
          )

          $releaseAssets = @(
            'dist/CodexAccountSwitcher.exe'
            'dist/CodexAccountSwitcher-Setup.exe'
            'dist/SHA256SUMS.txt'
          )

          if (gh release view "$env:GITHUB_REF_NAME" 2>$null) {
            gh release edit "$env:GITHUB_REF_NAME" `
              --title "Codex Account Switcher $env:GITHUB_REF_NAME" `
              --notes-file dist/RELEASE_NOTES.md
            gh release upload "$env:GITHUB_REF_NAME" $releaseAssets --clobber
          }
          else {
            gh release create "$env:GITHUB_REF_NAME" $releaseAssets `
              --title "Codex Account Switcher $env:GITHUB_REF_NAME" `
              --notes-file dist/RELEASE_NOTES.md
          }
