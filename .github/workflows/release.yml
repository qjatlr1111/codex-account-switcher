name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: .NET 8 준비
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Inno Setup 준비
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: 버전 계산
        id: version
        shell: powershell
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.1.3' }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: 단일 EXE와 설치 파일 생성
        shell: powershell
        run: ./scripts/Build-Installer.ps1 -ApplicationVersion '${{ steps.version.outputs.value }}'

      - name: 빌드 산출물 보관
        uses: actions/upload-artifact@v4
        with:
          name: CodexAccountSwitcher-Windows-x64
          path: |
            dist/CodexAccountSwitcher.exe
            dist/CodexAccountSwitcher-Setup.exe
            dist/SHA256SUMS.txt

      - name: GitHub Release 게시
        if: github.ref_type == 'tag'
        # Windows PowerShell 5.1은 워크플로의 한글 문자열을 시스템 코드 페이지로
        # 처리할 수 있으므로 UTF-8이 기본인 PowerShell 7을 사용합니다.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseNotes = @'
          ## 주요 변경

          - 현재 Codex 계정과 선택 계정이 같을 때 남은 사용량을 10초마다 동기화
          - 작업표시줄 포커스 전환 직후 위젯 위치와 최상위 표시 상태를 즉시 복구
          - 트레이 아이콘의 정보 메뉴와 앱 정보 창 추가
          - 위젯 메뉴·계정 메뉴·확인 창에 Windows 스타일 등장 애니메이션 적용
          - 계정 패널은 깜박임 방지를 위해 fade 없이 짧은 이동 애니메이션만 사용
          - 배포 전 변경 파일과 패키지의 보안 검토 규칙 추가

          ## 보안 및 호환성 안내

          이 프로그램은 OpenAI의 공식 제품이 아닌 비공식 커뮤니티 도구입니다. Codex 호환성을 위해 계정별 `auth.json`이 로컬 디스크에 평문으로 저장되므로 공유 PC나 공용 Windows 계정에서는 사용하지 마세요. 배포 파일은 코드 서명되지 않았으며 Windows SmartScreen 경고가 표시될 수 있습니다. 내려받은 파일은 함께 제공되는 `SHA256SUMS.txt`로 확인할 수 있습니다.
          '@
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'dist/RELEASE_NOTES.md'),
            $releaseNotes,
            [System.Text.UTF8Encoding]::new($false)
          )

          $releaseAssets = @(
            'dist/CodexAccountSwitcher.exe'
            'dist/CodexAccountSwitcher-Setup.exe'
            'dist/SHA256SUMS.txt'
          )

          if (gh release view "$env:GITHUB_REF_NAME" 2>$null) {
            gh release edit "$env:GITHUB_REF_NAME" `
              --title "Codex Account Switcher $env:GITHUB_REF_NAME" `
              --notes-file dist/RELEASE_NOTES.md
            gh release upload "$env:GITHUB_REF_NAME" $releaseAssets --clobber
          }
          else {
            gh release create "$env:GITHUB_REF_NAME" $releaseAssets `
              --title "Codex Account Switcher $env:GITHUB_REF_NAME" `
              --notes-file dist/RELEASE_NOTES.md
          }
