name: Claude Widget Release

# Codex 위젯 워크플로(release.yml)는 v*.*.* 태그만 처리합니다.
# Claude 위젯은 claude-v*.*.* 태그로만 배포해 두 앱의 릴리스가 섞이지 않게 합니다.
on:
  workflow_dispatch:
  push:
    tags:
      - "claude-v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: .NET 8 준비
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Inno Setup 준비
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: 버전 계산
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring('claude-v'.Length) } else { '1.0.2' }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: 단일 EXE와 설치 파일 생성
        shell: powershell
        run: ./scripts/Build-ClaudeInstaller.ps1 -ApplicationVersion '${{ steps.version.outputs.value }}'

      - name: 빌드 산출물 보관
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeAccountSwitcher-Windows-x64
          path: |
            dist/claude/ClaudeAccountSwitcher.exe
            dist/claude/ClaudeAccountSwitcher-Setup.exe
            dist/claude/SHA256SUMS.txt

      - name: GitHub Release 게시
        if: github.ref_type == 'tag'
        # 같은 저장소의 Codex 위젯이 releases/latest 링크와 업데이트 확인에 쓰므로
        # Claude 릴리스는 항상 --latest=false로 게시합니다.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseNotes = @'
          ## Claude 계정 전환 위젯

          작업 표시줄에서 현재 Claude 계정과 5시간·주간 잔여 사용량을 링 게이지로 보여주고, 등록한 계정으로 Claude Code 로그인을 전환하는 Windows 위젯입니다.

          - `ClaudeAccountSwitcher-Setup.exe`: 설치형 (Windows 로그인 시 자동 실행, 시작 메뉴·제거 프로그램 등록)
          - `ClaudeAccountSwitcher.exe`: 무설치 단일 실행 파일
          - `SHA256SUMS.txt`: 무결성 확인용 해시

          Claude Code(전역 `claude` 명령)가 설치되어 있어야 계정 추가가 동작합니다.

          ## 보안 및 호환성 안내

          이 프로그램은 Anthropic의 공식 제품이 아닌 비공식 커뮤니티 도구입니다. 계정별 `.credentials.json`이 로컬 디스크에 평문으로 저장되므로 공유 PC나 공용 Windows 계정에서는 사용하지 마세요. 사용량 조회에 쓰는 엔드포인트는 공개 API가 아니어서 예고 없이 바뀔 수 있습니다. 배포 파일은 코드 서명되지 않았으며 Windows SmartScreen 경고가 표시될 수 있습니다.
          '@
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'dist/claude/RELEASE_NOTES.md'),
            $releaseNotes,
            [System.Text.UTF8Encoding]::new($false)
          )

          $releaseAssets = @(
            'dist/claude/ClaudeAccountSwitcher.exe'
            'dist/claude/ClaudeAccountSwitcher-Setup.exe'
            'dist/claude/SHA256SUMS.txt'
          )
          $title = "Claude Account Switcher $($env:GITHUB_REF_NAME.Substring('claude-'.Length))"

          if (gh release view "$env:GITHUB_REF_NAME" 2>$null) {
            gh release edit "$env:GITHUB_REF_NAME" --title $title --notes-file dist/claude/RELEASE_NOTES.md --latest=false
            gh release upload "$env:GITHUB_REF_NAME" $releaseAssets --clobber
          }
          else {
            gh release create "$env:GITHUB_REF_NAME" $releaseAssets `
              --title $title `
              --notes-file dist/claude/RELEASE_NOTES.md `
              --latest=false
          }
